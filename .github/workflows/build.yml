name: Build

# 只被 .github/workflows/release.yml 用 workflow_call 调用，自己不挂任何触发条件。

on:
  workflow_call:
    inputs:
      msi_version:
        description: 安装包（MSI）内部版本号，由提交数推出（第 234 个提交 → 1.2.34）
        type: string
        required: true
      build_exe:
        description: 是否构建 Windows 安装包（自动构建只发布 jar）
        type: boolean
        required: false
        default: false

jobs:
  jar:
    name: Runnable jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build the fat jar and run the smoke checks
        run: ./gradlew fatJar smokeTest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: match3-jar
          path: build/libs/match3.jar

  exe:
    name: Single exe with a trimmed runtime
    if: ${{ inputs.build_exe }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Install WiX v7
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          # v7 起要先接受 OSMF EULA，否则任何 wix 命令都以 WIX7015 失败
          wix eula accept wix7
          # 不装这两个扩展，jpackage 会在生成 MSI 时报 WIX0144
          wix extension add --global WixToolset.Util.wixext/7.0.0
          wix extension add --global WixToolset.UI.wixext/7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix --version

      - name: Build the installer
        run: |
          # 镜像自带 WiX v3 留在 PATH 里会被 jpackage 挑中，生成 MSI 会失败
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notlike '*WiX Toolset*' }) -join ';'
          ./gradlew dist -PappVersion=${{ inputs.msi_version }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: match3-exe
          path: build/dist/*.exe
