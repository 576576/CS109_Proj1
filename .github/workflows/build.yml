name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jar:
    name: Runnable jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build the fat jar and run the smoke checks
        run: ./gradlew fatJar smokeTest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: match3-jar
          path: build/libs/match3.jar

  exe:
    name: Single exe with a trimmed runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Make sure WiX is available
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          Get-Command candle.exe | Select-Object -ExpandProperty Source

      # dist = packageInput（主 jar + 依赖 + resource，JavaFX 除外）
      #      + fxModules（JavaFX 的模块 jar，给 jlink 用）
      #      + jlinkRuntime（裁运行时）+ jpackage（出 exe，带图标）
      - name: Build the installer
        run: ./gradlew dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: match3-exe
          path: build/dist/*.exe
