name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jar:
    name: Runnable jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build the fat jar and run the smoke checks
        run: ./gradlew fatJar smokeTest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: match3-jar
          path: build/libs/match3.jar

  exe:
    name: Single exe with a trimmed runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Install WiX v5
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          # jpackage 要用到这两个扩展，不装会报 WIX0144
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix --version

      # dist = packageInput（主 jar + 依赖 + resource，JavaFX 除外）
      #      + fxModules（JavaFX 的模块 jar，给 jlink 用）
      #      + jlinkRuntime（裁运行时）+ jpackage（出 exe，带图标）
      - name: Build the installer
        run: |
          # runner 镜像自带 WiX v3.14：它留在 PATH 里就会被 jpackage 挑中，而 v3 生成 MSI 会以 311 失败
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notlike '*WiX Toolset*' }) -join ';'
          ./gradlew dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: match3-exe
          path: build/dist/*.exe
